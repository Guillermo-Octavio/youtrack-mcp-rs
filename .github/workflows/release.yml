name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release-binary:
    name: Build release binary (linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/youtrack-mcp dist/youtrack-mcp-x86_64-unknown-linux-gnu
      - name: Attach binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/youtrack-mcp-x86_64-unknown-linux-gnu

  publish-crate:
    name: cargo publish
    runs-on: ubuntu-latest
    needs: build-release-binary
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version=1 | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi
      # NOTE: requires a CARGO_REGISTRY_TOKEN repository secret to be
      # configured before this job can actually publish to crates.io.
      - run: cargo publish --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
