[package]
name = "youtrack-mcp-rs"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "MCP server for YouTrack — issues, articles, agile boards, and time tracking for AI coding agents"
repository = "https://github.com/Guillermo-Octavio/youtrack-mcp-rs"
readme = "README.md"
keywords = ["mcp", "youtrack", "ai-agent", "llm-tools"]
categories = ["development-tools", "artificial-intelligence"]

[[bin]]
name = "youtrack-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
rmcp = { version = "3.1.3", features = ["server", "client", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
url = "2.5.8"

[dev-dependencies]
anyhow = "1.0"
wiremock = "0.6"
